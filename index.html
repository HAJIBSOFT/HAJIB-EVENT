<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة حاجب لإدارة الفعاليات والكوادر المستقلة</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JS Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Header Navigation -->
    <header class="app-header">
        <div class="header-container">
            <div class="logo">
                <span class="logo-mark">H</span>
                <span class="logo-text">HAJIB <span>EVENTS</span></span>
            </div>
            <nav id="mainNav" class="nav-links">
                <!-- أزرار التنقل تتغير ديناميكياً عبر JS -->
            </nav>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-content" id="appRoot">
        <div class="loader-container" id="globalLoader">
            <div class="spinner"></div>
            <p>جاري تحميل المنصة...</p>
        </div>
    </main>

    <!-- Modal Base Container -->
    <div id="modalOverlay" class="modal-overlay hidden">
        <div class="modal-box" id="modalBox">
            <button class="modal-close" id="modalCloseBtn">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>

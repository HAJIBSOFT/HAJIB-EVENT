<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة حاجب - بوابة الكوادر والفعاليات</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="app-header">
        <div class="header-container">
            <div class="logo" onclick="routeView('events')">
                <div class="logo-symbol">H</div>
                <div class="logo-text">HAJIB <span>TALENTS</span></div>
            </div>
            <nav id="mainNav" class="nav-links"></nav>
        </div>
    </header>

    <main class="main-content" id="appRoot">
        <div style="text-align: center; padding: 4rem 0;">
            <p style="color: var(--text-muted);">جاري تحميل المنصة...</p>
        </div>
    </main>

    <!-- Modal System -->
    <div id="modalOverlay" class="modal-overlay hidden" onclick="handleBackdropClick(event)">
        <div class="modal-box" id="modalBox" onclick="event.stopPropagation()">
            <button class="modal-close" id="modalCloseBtn" type="button">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>
    <script src="app.js"></script>
</body>
</html>

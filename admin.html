<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة إدارة الفعاليات والكوادر - حاجب</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">

    <div class="admin-layout" id="adminAppLayout" style="display: none;">
        <!-- القائمة الجانبية -->
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-symbol admin">A</div>
                    <div class="logo-text">HAJIB <span>CONTROL</span></div>
                </div>
            </div>

            <nav class="sidebar-menu">
                <button class="sidebar-item active" id="btnNavEvents" onclick="switchAdminTab('events')">
                    <svg class="nav-svg" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/></svg>
                    الفعاليات
                </button>

                <button class="sidebar-item" id="btnNavStaff" onclick="switchAdminTab('staff')">
                    <svg class="nav-svg" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                    الكادر الميداني
                </button>

                <button class="sidebar-item" id="btnNavReports" onclick="switchAdminTab('reports')">
                    <svg class="nav-svg" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                    التقارير وسجلات العمل
                </button>

                <!-- يظهر فقط للمدير العام -->
                <button class="sidebar-item" id="btnNavAddManager" style="display: none;" onclick="openNewManagerModal()">
                    <svg class="nav-svg" viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    إضافة مدير
                </button>

                <div class="sidebar-spacer"></div>

                <button class="sidebar-item logout-item" onclick="handleAdminLogout()">
                    <svg class="nav-svg" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                    تسجيل الخروج
                </button>
            </nav>
        </aside>

        <!-- منطقة المحتوى الرئيسي -->
        <main class="admin-main-wrapper">
            <header class="admin-topbar">
                <button class="mobile-toggle" onclick="toggleSidebar()">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                </button>
                <div class="topbar-user-info" id="topbarUserInfo"></div>
            </header>

            <div class="admin-page-content" id="adminRoot">
                <div style="text-align: center; padding: 4rem 0;">
                    <p style="color: var(--text-muted);">جاري التحميل...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- شاشة الدخول المستقلة للمدير -->
    <div id="adminLoginScreen" class="admin-login-wrapper" style="display: none;"></div>

    <!-- نافذة منبثقة موحدة -->
    <div id="modalOverlay" class="modal-overlay hidden" onclick="handleBackdropClick(event)">
        <div class="modal-box modal-lg" id="modalBox" onclick="event.stopPropagation()">
            <button class="modal-close" id="modalCloseBtn" type="button">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>
    <script src="admin.js"></script>
</body>
</html>
